name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: 单元测试
        # 全部测试均为离线用例（LLM 与检索都用桩），不需要任何 API key。
        # 这一点是刻意保证的：CI 要是依赖外部服务，就没人会去修它。
        run: python -m pytest tests/ -q

      - name: 语料清洗冒烟
        # 清洗是纯规则、不调模型，可以在这里跑通，保证「克隆下来第一步」不会烂
        run: python scripts/01_clean_corpus.py

  docker:
    # README 说"不用装 Python 就能复现评测"。这个 job 真的构建一次镜像，
    # 并在镜像里跑一遍不花钱的清洗步骤——否则那句承诺没人验过。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t finance-rag-eval:ci .

      - name: 镜像里能跑通流水线
        # 01 清洗是纯规则、不调模型、不需要 key。
        # 但只跑它不够——清洗不 import numpy，而 numpy 的 wheel 不自带 BLAS，
        # slim 基础镜像缺库时 import 就炸。所以再显式验一次 numpy，
        # 把「默认 CMD 一起容器就死」这类问题挡在合并前。
        run: |
          docker run --rm finance-rag-eval:ci python scripts/01_clean_corpus.py
          docker run --rm finance-rag-eval:ci python -c "import numpy, sys; print('numpy', numpy.__version__, '可用')"
